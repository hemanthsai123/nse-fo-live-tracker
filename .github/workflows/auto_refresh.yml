name: Auto-Refresh NSE F&O Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run master python pipeline
        run: python run_all.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stock_history_db.json stock_30day_analysis.json nifty_option_chain.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard & market data: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push)
